<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Certificate PDF</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:#202124;color:#e8eaed;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}
.screen{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.pdf-icon{width:72px;height:72px;border-radius:5px;background:#1c1d20;display:grid;place-items:center;color:#292a2e;font-size:23px;font-weight:700;letter-spacing:1px;margin-bottom:31px}
.filename{max-width:100%;color:#aeb0b7;font-size:clamp(17px,3.5vw,26px);margin-bottom:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open-button{width:min(520px,82vw);height:110px;border:0;border-radius:42px;background:#8ab4f8;color:#101820;font-size:26px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background .15s ease,transform .15s ease}
.open-button:hover{background:#9bbef8}.open-button:active{transform:scale(.99)}
@media(max-width:480px){.open-button{height:82px;border-radius:34px;font-size:22px}}
</style>
</head>
<body>
<main class="screen">
  <div class="pdf-icon" aria-hidden="true">PDF</div>
  <div class="filename">NPTEL26CS67S45770252703174827.pdf</div>
  <!-- Keep NPTEL26CS67S45770252703174827.pdf in the same GitHub repository folder as this index.html. -->
  <a class="open-button" href="./NPTEL26CS67S45770252703174827.pdf">Open</a>
</main>
</body>
</html>
